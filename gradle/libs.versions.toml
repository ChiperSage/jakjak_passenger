[versions]
agp                   = "8.3.2"
kotlin                = "1.9.24"
coreKtx               = "1.13.1"
appcompat             = "1.7.0"
material              = "1.12.0"
constraintlayout      = "2.1.4"
lifecycle             = "2.8.2"
navigation            = "2.7.7"
activity              = "1.9.0"
fragment              = "1.7.1"
firebaseBom           = "33.1.1"
googleGms             = "4.4.2"
coroutines            = "1.8.1"
glide                 = "4.16.0"
junit                 = "4.13.2"
junitExt              = "1.2.1"
espresso              = "3.6.1"
playServicesLocation  = "21.3.0"

[libraries]
# AndroidX Core
androidx-core-ktx           = { group = "androidx.core",          name = "core-ktx",                        version.ref = "coreKtx" }
androidx-appcompat          = { group = "androidx.appcompat",      name = "appcompat",                        version.ref = "appcompat" }
material                    = { group = "com.google.android.material", name = "material",                     version.ref = "material" }
androidx-constraintlayout   = { group = "androidx.constraintlayout", name = "constraintlayout",               version.ref = "constraintlayout" }
androidx-activity-ktx       = { group = "androidx.activity",       name = "activity-ktx",                    version.ref = "activity" }
androidx-fragment-ktx       = { group = "androidx.fragment",       name = "fragment-ktx",                    version.ref = "fragment" }

# Lifecycle
androidx-lifecycle-viewmodel-ktx = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-ktx",         version.ref = "lifecycle" }
androidx-lifecycle-livedata-ktx  = { group = "androidx.lifecycle", name = "lifecycle-livedata-ktx",          version.ref = "lifecycle" }
androidx-lifecycle-runtime-ktx   = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx",           version.ref = "lifecycle" }

# Navigation
androidx-navigation-fragment = { group = "androidx.navigation",    name = "navigation-fragment-ktx",          version.ref = "navigation" }
androidx-navigation-ui       = { group = "androidx.navigation",    name = "navigation-ui-ktx",                version.ref = "navigation" }

# Firebase (via BOM)
firebase-bom                = { group = "com.google.firebase",     name = "firebase-bom",                    version.ref = "firebaseBom" }
firebase-auth               = { group = "com.google.firebase",     name = "firebase-auth-ktx" }
firebase-firestore          = { group = "com.google.firebase",     name = "firebase-firestore-ktx" }
firebase-messaging          = { group = "com.google.firebase",     name = "firebase-messaging-ktx" }
firebase-storage            = { group = "com.google.firebase",     name = "firebase-storage-ktx" }

# Coroutines
kotlinx-coroutines-android  = { group = "org.jetbrains.kotlinx",  name = "kotlinx-coroutines-android",       version.ref = "coroutines" }
kotlinx-coroutines-play     = { group = "org.jetbrains.kotlinx",  name = "kotlinx-coroutines-play-services", version.ref = "coroutines" }

# Image loading
glide                       = { group = "com.github.bumptech.glide", name = "glide",                         version.ref = "glide" }

# Location
play-services-location       = { group = "com.google.android.gms", name = "play-services-location",        version.ref = "playServicesLocation" }

# Testing
junit                       = { group = "junit",                   name = "junit",                           version.ref = "junit" }
androidx-junit              = { group = "androidx.test.ext",       name = "junit",                           version.ref = "junitExt" }
androidx-espresso           = { group = "androidx.test.espresso",  name = "espresso-core",                   version.ref = "espresso" }

[plugins]
android-application = { id = "com.android.application",           version.ref = "agp" }
kotlin-android      = { id = "org.jetbrains.kotlin.android",       version.ref = "kotlin" }
google-gms          = { id = "com.google.gms.google-services",     version.ref = "googleGms" }
