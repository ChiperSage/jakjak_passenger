# 1. NAMA WORKFLOW
name: Android Build & CI Pipeline

# 2. TRIGGER (Kapan skrip ini otomatis berjalan?)
on:
  push:
    branches: [ "main", "master" ]   # Berjalan saat ada 'git push' ke branch main/master
  pull_request:
    branches: [ "main", "master" ]   # Berjalan saat ada Pull Request
  workflow_dispatch:                # Memungkinkan tombol "Run workflow" manual di GitHub

# 3. JOBS (Rangkaian tugas yang dieksekusi di server virtual)
jobs:
  build:
    runs-on: ubuntu-latest # Menggunakan server virtual Linux Ubuntu gratis dari GitHub

    steps:
      # Langkah 1: Mengunduh/Clone kode dari repository GitHub ke server virtual
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Langkah 2: Memasang JDK (Java Development Kit) versi 17 yang dibutuhkan Kotlin/Gradle
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle # Mengaktifkan cache Gradle agar proses build berikutnya lebih cepat

      # Langkah 3: Dekode file google-services.json dari GitHub Secrets (khusus proyek Firebase)
      - name: Decode Google Services JSON
        run: |
          echo "${{ secrets.GOOGLE_SERVICES_BASE64 }}" | base64 --decode > app/google-services.json

      # Langkah 4: Memberikan izin akses eksekusi pada skrip Gradle
      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      # Langkah 5: Memproses kompilasi kode Kotlin menjadi file APK Debug
      - name: Build Debug APK
        run: ./gradlew assembleDebug

      # Langkah 6: Mengunggah hasil APK ke halaman GitHub Actions agar bisa di-download
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
