name: Android Build Pipeline

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5 # Diperbarui ke v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5 # Diperbarui ke v5 (Menghilangkan warning)
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Decode Google Services JSON
        run: |
          echo "${{ secrets.GOOGLE_SERVICES_BASE64 }}" | base64 --decode > app/google-services.json

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace # Menambahkan --stacktrace untuk log detail jika gagal

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v5 # Diperbarui ke v5
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
